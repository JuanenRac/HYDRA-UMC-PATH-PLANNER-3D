[package]
name = "hydra-umc-path-planner-3d"
version = "0.0.3"
edition = "2021"
description = "Centralized multi-robot 3D collision avoidance and path optimizer (RRT* / potential fields) for the HYDRA-UMC swarm."
license = "GPL-3.0-only"
authors = ["JuanenRac (Electro Hobby 3D) <electrohobby3d@gmail.com>"]
repository = "https://github.com/JuanenRac/HYDRA-UMC-PATH-PLANNER-3D"

[[bin]]
name = "hydra-umc-path-planner-3d"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
