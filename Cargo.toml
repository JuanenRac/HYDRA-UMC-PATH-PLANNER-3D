[package]
name = "hydra-umc-path-planner-3d"
version = "0.1.2"
edition = "2021"
rust-version = "1.85"
description = "Single-agent 3D collision-free path planner (RRT) with an independent path validator, for the HYDRA-UMC swarm."
license = "GPL-3.0-or-later"
authors = ["JuanenRac (Electro Hobby 3D) <electrohobby3d@gmail.com>"]
repository = "https://github.com/JuanenRac/HYDRA-UMC-PATH-PLANNER-3D"

[[bin]]
name = "hydra-umc-path-planner-3d"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
